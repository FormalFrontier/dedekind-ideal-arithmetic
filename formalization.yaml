version: "v0.4"

project:
  name: "dedekind-ideal-arithmetic"
  description: >-
    Six reusable results on ideal absolute norms, principal primes obtained
    from element norms, and ideal class groups of Dedekind-domain localizations.
    The localization results give surjectivity of class extension and conditional
    PID and UFD criteria when a generating class becomes trivial.
  authors:
    - "Formal Frontier Agents"
    - "Prism (AI agent; ideal-norm and principal-prime proofs)"
    - "Atlas (AI agent; localization and class-group proofs)"
  responsible_maintainers:
    - "Prism (overall integration and ideal arithmetic)"
    - "Atlas (localization and class-group unit)"
  license: "Apache-2.0"

sources:
  - title: "The K-book: An Introduction to Algebraic K-theory"
    authors:
      - "Charles A. Weibel"
    id: "https://sites.math.rutgers.edu/~weibel/Kbook/Kbook.pdf"
    type: "book"
    location: "Complete-book build dated 2013-08-29, Chapter I, section 3"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The cyclotomic examples motivated the project's earlier ideal-arithmetic
      research. This library extracts generic prerequisites; it does not compute
      the examples' class numbers or claim full formalization of the book.
      No source PDF, scan or quoted passage is included. No explicit license or
      broader redistribution grant for the book was established; access to the
      mathematical source is not a grant to reproduce its expression.
  - title: "Ideal class groups under localization of Dedekind domains"
    type: "folklore"
    relationship: "independently-proves"
    author_endorsement: "n/a"
    note: >-
      Standard mathematics, not a claim of a newly discovered theorem. Atlas's
      project proof chooses a target ideal representative, contracts and extends
      it, and transports ideal classes using mathlib. Surjectivity then turns a
      killed source generator into trivial target classes, giving the PID and
      UFD consequences. No particular textbook's proof expression is asserted
      as the origin of this contribution.

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4/tree/83abb3e776bdefcbc447a1e44d0debe4010039e5"
    relationship: "builds-on"
    note: >-
      Native ideal norms and subgroup indices, class-group representatives and
      extendedHom, localization map_under, and PID/UFD instances are reused.
      Mathlib contributors retain their authorship and Apache-2.0 notices in
      the dependency. This repository does not replace those definitions or
      vendor mathlib sources. Lake's resolved manifest also retains generated
      dependency metadata derived from mathlib's manifest.

status:
  scope: >-
    The six declarations below describe the library's existing mathematics.
    They do not provide element-norm witnesses, class-number computations,
    injectivity of class extension or a proof that a proposed class generates
    a class group. Existing mathematics has been reviewed and released; this
    descriptive metadata does not certify acceptance of later candidate commits.
    The two earlier original-project diagnostic adaptations are credited in the
    README, with exact private predecessors retained in provenance records.
    Detailed source correspondence and coverage decisions remain in source
    repositories.
  main_results:
    - declaration: "Ideal.absNorm_lt_absNorm_of_lt"
      file: "DedekindIdealArithmetic/Ideal/AbsNorm.lean"
      note: >-
        In an infinite commutative Dedekind domain with finite quotients,
        strict inclusion with nonzero smaller ideal strictly reverses absolute
        norms. The nonzero hypothesis is not omitted.
    - declaration: "Ideal.eq_of_le_of_absNorm_eq"
      file: "DedekindIdealArithmetic/Ideal/AbsNorm.lean"
      note: >-
        Under the same ambient hypotheses, nested ideals with equal absolute
        norm are equal, including the zero-ideal case.
    - declaration: "Ideal.exists_principal_prime_over_of_norm_natAbs_eq"
      file: "DedekindIdealArithmetic/Ideal/PrincipalPrime.lean"
      note: >-
        In an infinite commutative Dedekind domain finite free over the integers,
        a supplied element with prime absolute algebraic norm yields a
        principal prime above that rational prime. The element and norm
        equality are hypotheses, not outputs.
    - declaration: "ClassGroup.extendedHom_surjective_of_isLocalization"
      file: "DedekindIdealArithmetic/ClassGroup/Localization.lean"
      note: >-
        For Dedekind domains A and B with B an A-algebra torsion-free as an
        A-module and an actual localization at M, class extension is onto.
        No injectivity or finiteness of either class group is asserted.
    - declaration: "ClassGroup.isPrincipalIdealRing_of_generator_of_isLocalization"
      file: "DedekindIdealArithmetic/ClassGroup/Localization.lean"
      note: >-
        With the same localization hypotheses, if every source class is an
        integral power of a supplied class g and g extends to one, then B
        is a principal ideal ring. Both generation and killing are inputs.
    - declaration: "ClassGroup.uniqueFactorizationMonoid_of_generator_of_isLocalization"
      file: "DedekindIdealArithmetic/ClassGroup/Localization.lean"
      note: >-
        The same exact hypotheses imply unique factorization in B through
        the proved principal-ideal-ring criterion.

automation:
  methods:
    - method: "agent"
      framework: "Hive-managed AI agents using Lean and Lake"
      tool_setup: >-
        Prism and Atlas composed Lean proofs using native mathlib APIs,
        compiler feedback and ordinary tactics such as rw, simp, constructor,
        congr, by_cases and typeclass inference. Separate agent executions
        reviewed the mathematical development contributions. Toolchain and
        dependency revisions are recorded by the repository's Lean/Lake files.
      prompting_notes: >-
        Bounded project assignments required reusable statements, explicit
        hypotheses, native API reuse, provenance and independent mathematical
        review. No claim is made of a human-authored proof or human review.
  notes: >-
    AI agents authored code, proof text, documentation and this metadata.
    Historical model identities, total time and expenditure are not reported
    because no complete measurements have been established for this artifact.
    AI involvement does not itself establish origin, correctness or rights.

fidelity:
  divergences: >-
    The ideal-norm extraction removes the earlier cyclotomic specialization:
    norm comparison needs only an infinite Dedekind domain with finite
    quotients, while principal-prime extraction uses finite freeness over the
    integers and a prime absolute norm, not a positive signed norm.
    The localization criterion is generic and conditional on the supplied
    generator and killing proofs. These prerequisites are not a formalization
    of a concrete cyclotomic or geometric example. No new K-theory,
    class-group or ideal encoding is introduced.

review:
  status: "agent-reviewed"
  notes: >-
    AI-agent independent review covered the original mathematical contributions
    and the previously released full artifact, including its metadata, rights and
    history. This field describes earlier review; it does not approve a changed
    checkout, substitute for exact-candidate review or certify a new release.
    Actual release identity and accepted checks follow exact commits; a
    schema-valid metadata file does not certify its assertions or source coverage.

acknowledgements: >-
  The mathlib community supplies the underlying formal theories; Lean and Lake
  supply the proof assistant and build system. Bibliographic authorship of
  Weibel's book is distinct from project formalization authorship. The
  formalization.yaml standard supplies the metadata vocabulary; the filled-in
  descriptions here are project-authored. Existing third-party licenses and
  notices remain applicable and are not replaced by collective project credit.
