version: "v0.4"

project:
  name: "dedekind-ideal-arithmetic"
  description: >-
    Reusable ideal arithmetic, module indices and intrinsic heights of normed
    invertible modules over rings of integers. Ideal-norm comparisons,
    principal-prime extraction and class-group localization sit alongside
    finite section quotients, common scalar multiples, integral-section
    heights and normalized logarithmic heights, with tensor-product, positive
    metric-rescaling and equivalence-pullback formulas. Rational frames evaluate
    the same intrinsic height through coefficient-ideal norms and weighted
    archimedean products. Nonzero fractional-ideal norms factor as finite-support
    prime-norm products with signed exponents; over number fields, negative
    coefficient-ideal exponents give the finite-place numerator of height.
    Principal fractional-ideal counts determine scalar adic valuations and
    residue-cardinality completion norms. Supplied frames extend to linear
    coordinates over semiring algebras without module finiteness hypotheses.
    Generic fractional-ideal index comparisons, relative-degree formulas for
    weighted infinite-place products, extension laws for fractional-ideal norms,
    rank-one seminorm scalar extension and isometric completion maps supply
    further interfaces.
  authors:
    - "Formal Frontier Agents"
  license: "Apache-2.0"

sources:
  - title: "The K-book: An Introduction to Algebraic K-theory"
    authors:
      - "Charles A. Weibel"
    id: "https://sites.math.rutgers.edu/~weibel/Kbook/Kbook.pdf"
    type: "book"
    location: "Complete-book build dated 2013-08-29, Chapter I, section 3"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The cyclotomic examples motivated the project's earlier ideal-arithmetic
      research. This library extracts generic prerequisites; it does not compute
      the examples' class numbers or claim full formalization of the book.
      No source PDF, scan or quoted passage is included. No explicit license or
      broader redistribution grant for the book was established; access to the
      mathematical source is not a grant to reproduce its expression.
  - title: "Ideal class groups under localization of Dedekind domains"
    type: "folklore"
    relationship: "independently-proves"
    author_endorsement: "n/a"
    note: >-
      Standard mathematics, not a claim of a newly discovered theorem. Atlas's
      project proof chooses a target ideal representative, contracts and extends
      it, and transports ideal classes using mathlib. Surjectivity then turns a
      killed source generator into trivial target classes, giving the PID and
      UFD consequences. No particular textbook's proof expression is asserted
      as the origin of this contribution.

  - title: "Abelian Varieties"
    authors:
      - "J. S. Milne"
    type: "book"
    location: "IV section 6, 6.2–6.3"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Reference for height conventions on normed invertible modules, tensor
      products, positive metric rescaling and isometry invariance. The scope
      here is fixed-field intrinsic heights, integral-section, rational-frame
      and arithmetic finite-place evaluations, and their metric laws. It does
      not construct norms on finite-completion fibres or supply the full
      geometric or finite-extension height theory.

related_formalizations:
  - id: "https://github.com/leanprover-community/mathlib4/tree/83abb3e776bdefcbc447a1e44d0debe4010039e5"
    relationship: "builds-on"
    note: >-
      Ideal norms and subgroup indices, class-group representatives and
      extendedHom, localization map_under, and PID/UFD instances are reused,
      as are Module.Invertible, ideal presentations, flat scalar extension,
      quotient cardinalities, fractional ideals and their signed prime
      factorizations, finite-place/height-one-prime equivalences, tensor
      base-change equivalences, completion seminorms, infinite-place products
      and NumberField.LiesOver.completionMap.
      Mathlib contributors retain their authorship and Apache-2.0 notices in
      the dependency. This repository does not replace those definitions or
      vendor mathlib sources. Lake's resolved manifest also retains generated
      dependency metadata derived from mathlib's manifest.

highlights:
  - title: "Ideal norms, inclusion and prime factorization"
    statement: >-
      In an infinite commutative Dedekind domain with finite quotients, a
      nonzero smaller ideal has strictly larger absolute norm, and nested
      ideals of equal absolute norm coincide. Over a Dedekind domain finite
      free over the integers, the norm of each nonzero fractional ideal is
      the finite-support product of height-one prime norms raised to signed
      integer exponents. Its fraction field needs no number-field structure.
      For a nonzero scalar in any Dedekind fraction field, its valuation is
      the exponential of its negative principal count. With an infinite
      base ring and finite quotients, its completion norm is the residue
      cardinality raised to that negative count.
    declarations:
      - declaration: "Ideal.absNorm_lt_absNorm_of_lt"
        file: "DedekindIdealArithmetic/Ideal/AbsNorm.lean"
      - declaration: "Ideal.eq_of_le_of_absNorm_eq"
        file: "DedekindIdealArithmetic/Ideal/AbsNorm.lean"
      - declaration: "FractionalIdeal.absNorm_eq_finprod_count"
        file: "DedekindIdealArithmetic/Ideal/FractionalNorm.lean"
      - declaration: "IsDedekindDomain.HeightOneSpectrum.valuation_eq_exp_neg_count_spanSingleton"
        file: "DedekindIdealArithmetic/Ideal/AdicNorm.lean"
      - declaration: "IsDedekindDomain.HeightOneSpectrum.norm_algebraMap_eq_zpow_neg_count_spanSingleton"
        file: "DedekindIdealArithmetic/Ideal/AdicNorm.lean"
  - title: "Principal primes from element norms"
    statement: >-
      In an infinite commutative Dedekind domain finite free over the integers,
      a supplied element with prime absolute algebraic norm yields a principal
      prime above that rational prime.
    declarations:
      - declaration: "Ideal.exists_principal_prime_over_of_norm_natAbs_eq"
        file: "DedekindIdealArithmetic/Ideal/PrincipalPrime.lean"
  - title: "Class groups under localization"
    statement: >-
      Class extension is surjective for torsion-free localizations of Dedekind
      domains, and a supplied class generator killed by extension makes the
      target a principal ideal ring and a unique factorization domain.
    declarations:
      - declaration: "ClassGroup.extendedHom_surjective_of_isLocalization"
        file: "DedekindIdealArithmetic/ClassGroup/Localization.lean"
      - declaration: "ClassGroup.isPrincipalIdealRing_of_generator_of_isLocalization"
        file: "DedekindIdealArithmetic/ClassGroup/Localization.lean"
      - declaration: "ClassGroup.uniqueFactorizationMonoid_of_generator_of_isLocalization"
        file: "DedekindIdealArithmetic/ClassGroup/Localization.lean"
  - title: "Sections of invertible modules"
    statement: >-
      Nonzero sections of invertible modules over commutative domains with
      finite quotients span finite-index submodules, and any two nonzero
      sections of one invertible module over a commutative domain admit a
      common nonzero scalar multiple.
    declarations:
      - declaration: "Module.Invertible.finite_quotient_span_singleton"
        file: "DedekindIdealArithmetic/Module/Index.lean"
      - declaration: "Module.Invertible.exists_nonzero_smul_eq"
        file: "DedekindIdealArithmetic/Module/Index.lean"
  - title: "Intrinsic heights of normed invertible modules"
    statement: >-
      For a number field K, definite seminorms on the completion fibres of an
      invertible module over its ring of integers define a positive height
      equal to the section index divided by the weighted norm product for
      every nonzero integral section, with ordinary norms weighted one at
      real places and two at complex places, and normalized logarithmic
      height equal to (log index minus the weighted log norm sum) divided
      by [K:Q]. For two such invertible modules, tensor metrics multiply heights
      and add normalized logarithmic heights. Positive placewise rescaling
      divides height by the weighted product of the factors and subtracts their
      weighted logarithmic sum divided by [K:Q]. Pullback along an O_K-linear
      equivalence of invertible modules preserves both heights. Every supplied
      rational frame evaluates the same height as the reciprocal of the
      product of its coefficient-ideal norm and the weighted archimedean
      product at its rational unit vector. Equivalently, height is the
      finite-support product of residue cardinalities with negative
      coefficient-ideal exponents, divided by that archimedean product.
      The coefficient ideal is automatically nonzero, and the residue
      cardinalities require no additional finite-place weights. Only
      logarithmic height is divided by [K:Q]. Norms on finite-completion
      fibres and finite-extension height transport are not provided.
    declarations:
      - declaration: "NumberField.ArchimedeanNorms.height_eq"
        file: "DedekindIdealArithmetic/NumberField/ModuleHeight.lean"
      - declaration: "NumberField.ArchimedeanNorms.height_pos"
        file: "DedekindIdealArithmetic/NumberField/ModuleHeight.lean"
      - declaration: "NumberField.ArchimedeanNorms.normalizedLogHeight_eq"
        file: "DedekindIdealArithmetic/NumberField/ModuleHeight.lean"
      - declaration: "NumberField.ArchimedeanNorms.height_tensor"
        file: "DedekindIdealArithmetic/NumberField/MetricTensorProduct.lean"
      - declaration: "NumberField.ArchimedeanNorms.normalizedLogHeight_tensor"
        file: "DedekindIdealArithmetic/NumberField/MetricTensorProduct.lean"
      - declaration: "NumberField.ArchimedeanNorms.height_rescale"
        file: "DedekindIdealArithmetic/NumberField/MetricRescaling.lean"
      - declaration: "NumberField.ArchimedeanNorms.normalizedLogHeight_rescale"
        file: "DedekindIdealArithmetic/NumberField/MetricRescaling.lean"
      - declaration: "NumberField.ArchimedeanNorms.height_comap"
        file: "DedekindIdealArithmetic/NumberField/MetricTransport.lean"
      - declaration: "NumberField.ArchimedeanNorms.normalizedLogHeight_comap"
        file: "DedekindIdealArithmetic/NumberField/MetricTransport.lean"
      - declaration: "NumberField.ArchimedeanNorms.height_eq_rationalFrame"
        file: "DedekindIdealArithmetic/NumberField/RationalFrameHeight.lean"
      - declaration: "NumberField.ArchimedeanNorms.normalizedLogHeight_eq_rationalFrame"
        file: "DedekindIdealArithmetic/NumberField/RationalFrameHeight.lean"
      - declaration: "LinearEquiv.coefficientMap_injective"
        file: "DedekindIdealArithmetic/Module/CoefficientIdeal.lean"
      - declaration: "NumberField.ArchimedeanNorms.rationalEval_eq_zero_iff"
        file: "DedekindIdealArithmetic/NumberField/RationalFibre.lean"
      - declaration: "NumberField.InfinitePlace.prod_comap_pow_mult"
        file: "DedekindIdealArithmetic/NumberField/InfinitePlaceProducts.lean"
      - declaration: "FractionalIdeal.absNorm_extendedHom"
        file: "DedekindIdealArithmetic/Ideal/FractionalNorm.lean"
      - declaration: "NumberField.FinitePlace.absNorm_eq_finprod_count"
        file: "DedekindIdealArithmetic/NumberField/FinitePlaceHeight.lean"
      - declaration: "NumberField.ArchimedeanNorms.height_eq_finitePlace"
        file: "DedekindIdealArithmetic/NumberField/FinitePlaceHeight.lean"

status:
  scope: >-
    Ideal arithmetic, generic quotient indices, intrinsic fixed-field heights
    and their tensor, positive-rescaling and equivalence-pullback laws are
    described below. Supplied rational frames evaluate height through their
    coefficient-ideal norms and weighted rational-fibre norm products, or
    through residue-cardinality products with negative coefficient-ideal
    exponents and the same archimedean denominator. These products have finite
    support. Generic semiring-algebra coordinates of supplied frames and
    principal-count/completion-norm bridges support these interfaces without
    constructing finite-completion fibre seminorms.
    Generic fractional-ideal norm/index comparisons include zero
    ideals and sections; prime-exponent norm factorization requires a nonzero
    ideal, as supplied automatically by a rational frame. Weighted infinite-place
    products, fractional-ideal norm extension formulas, seminorm scalar extension
    and isometric completion maps supply further interfaces, not
    finite-extension-height evaluations. Element-norm witnesses, class-number
    computations, injectivity of class extension and proofs of proposed class
    generators are not supplied. The finite-place exponent formula does not
    construct finite-completion fibre norms, their unit balls or tensor transport
    of finite local frames. Finite-extension height transport remains open.
  main_results:
    - declaration: "IsDedekindDomain.HeightOneSpectrum.valuation_eq_exp_neg_count_spanSingleton"
      file: "DedekindIdealArithmetic/Ideal/AdicNorm.lean"
      note: >-
        For any Dedekind domain R, fraction field K, height-one prime p and
        nonzero a, p.valuation K a is the exponential of the negative count
        of the principal fractional ideal generated by a. No finite-quotient
        or finite-free-over-integers assumption is required.
    - declaration: "IsDedekindDomain.HeightOneSpectrum.norm_algebraMap_eq_zpow_neg_count_spanSingleton"
      file: "DedekindIdealArithmetic/Ideal/AdicNorm.lean"
      note: >-
        With R infinite and having finite quotients, the norm of a nonzero
        scalar in p.adicCompletion K is the residue cardinality raised to
        its negative principal fractional-ideal count. The positive count
        weight therefore cancels the norm; no norm on K is chosen.
    - declaration: "LinearEquiv.scalarExtensionCoordinate"
      file: "DedekindIdealArithmetic/Module/TensorCoordinates.lean"
      note: >-
        A supplied linear coordinate M equiv_R R extends to an F-linear
        coordinate on F tensor_R M over a semiring algebra. Its pure-tensor
        and inverse formulas hold without finiteness or norm hypotheses.
    - declaration: "LinearEquiv.fibreCoordinate"
      file: "DedekindIdealArithmetic/Module/CoefficientIdeal.lean"
      note: >-
        A frame on K tensor_R M induces an F-linear coordinate on F tensor_R M
        through compatible scalar towers over commutative semirings R and K
        and a semiring F. Pure-tensor, rational-fibre, inverse, frame-change
        and whole-equivalence unit formulas require no arithmetic, module
        finiteness, torsion-free, invertibility or norm hypotheses.
    - declaration: "Ideal.absNorm_lt_absNorm_of_lt"
      file: "DedekindIdealArithmetic/Ideal/AbsNorm.lean"
      note: >-
        In an infinite commutative Dedekind domain with finite quotients,
        strict inclusion with nonzero smaller ideal strictly reverses absolute
        norms. The nonzero hypothesis is not omitted.
    - declaration: "Ideal.eq_of_le_of_absNorm_eq"
      file: "DedekindIdealArithmetic/Ideal/AbsNorm.lean"
      note: >-
        Under the same ambient hypotheses, nested ideals with equal absolute
        norm are equal, including the zero-ideal case.
    - declaration: "Ideal.exists_principal_prime_over_of_norm_natAbs_eq"
      file: "DedekindIdealArithmetic/Ideal/PrincipalPrime.lean"
      note: >-
        In an infinite commutative Dedekind domain finite free over the integers,
        a supplied element with prime absolute algebraic norm yields a
        principal prime above that rational prime. The element and norm
        equality are hypotheses, not outputs.
    - declaration: "ClassGroup.extendedHom_surjective_of_isLocalization"
      file: "DedekindIdealArithmetic/ClassGroup/Localization.lean"
      note: >-
        For Dedekind domains A and B with B an A-algebra torsion-free as an
        A-module and a localization at M, class extension is onto.
        No injectivity or finiteness of either class group is asserted.
    - declaration: "ClassGroup.isPrincipalIdealRing_of_generator_of_isLocalization"
      file: "DedekindIdealArithmetic/ClassGroup/Localization.lean"
      note: >-
        With the same localization hypotheses, if every source class is an
        integral power of a supplied class g and g extends to one, then B
        is a principal ideal ring. Both generation and killing are inputs.
    - declaration: "ClassGroup.uniqueFactorizationMonoid_of_generator_of_isLocalization"
      file: "DedekindIdealArithmetic/ClassGroup/Localization.lean"
      note: >-
        The same exact hypotheses imply unique factorization in B through
        the proved principal-ideal-ring criterion.
    - declaration: "Submodule.cardQuot_map_of_injective"
      file: "DedekindIdealArithmetic/Module/Index.lean"
      note: >-
        For an injective linear map f over a ring, the quotient index of
        p.map f equals p.cardQuot times the quotient index of the range of f,
        without assuming either quotient finite. For a nonzero section of a
        torsion-free module over a domain, scalar multiplication multiplies
        its index by the principal left-ideal index, including zero scalars
        and infinite quotients. Over an infinite commutative Dedekind domain,
        the scalar factor is the principal ideal's absolute norm.
    - declaration: "Module.Invertible.finite_quotient_span_singleton"
      file: "DedekindIdealArithmetic/Module/Index.lean"
      note: >-
        Over a commutative domain with finite quotients, the quotient of an
        invertible module by the span of any nonzero section is finite.
    - declaration: "Module.Invertible.exists_nonzero_smul_eq"
      file: "DedekindIdealArithmetic/Module/Index.lean"
      note: >-
        Any two nonzero sections of an invertible module over a commutative
        domain admit a common nonzero scalar multiple. No finite-quotient
        hypothesis or principal presentation is required.
    - declaration: "Module.Invertible.cardQuot_span_singleton_tmul"
      file: "DedekindIdealArithmetic/Module/Index.lean"
      note: >-
        Over a commutative Dedekind domain with finite quotients, for two
        invertible modules and nonzero sections m and n, the index of the
        span of m tensor n is the product of their section indices. The ring
        may be finite and the modules need not be free.
    - declaration: "NumberField.ArchimedeanNorms.height_eq"
      file: "DedekindIdealArithmetic/NumberField/ModuleHeight.lean"
      note: >-
        For a number field K and Module.Invertible (O_K) M, definite seminorms
        on all vectors of each completion fibre give a positive height equal
        to cardQuot (span {m}) divided by the weighted norm product for every
        nonzero integral m. Ordinary unsquared completion norms carry weight
        one at real places and two at complex places. No integral freeness or
        stored section-independence premise is assumed.
    - declaration: "NumberField.ArchimedeanNorms.normalizedLogHeight_eq"
      file: "DedekindIdealArithmetic/NumberField/ModuleHeight.lean"
      note: >-
        Under the same height hypotheses, the normalized logarithmic height
        at every nonzero integral section is (log index minus the weighted
        logarithmic norm sum) divided by [K:Q] and may be negative. The standard
        metric on O_K has multiplicative height one and normalized logarithmic
        height zero.
    - declaration: "NumberField.ArchimedeanNorms.height_tensor"
      file: "DedekindIdealArithmetic/NumberField/MetricTensorProduct.lean"
      note: >-
        For a number field K and invertible O_K-modules M and N with
        archimedean norms P and Q, (P.tensor Q).height = P.height * Q.height.
        The tensor metric is defined on every fibre vector and multiplies
        norms on arbitrary pure tensors of completion-fibre vectors under
        the canonical base-change comparison. No integral basis is assumed.
    - declaration: "NumberField.ArchimedeanNorms.normalizedLogHeight_tensor"
      file: "DedekindIdealArithmetic/NumberField/MetricTensorProduct.lean"
      note: >-
        Under the same tensor hypotheses, the normalized logarithmic height
        of P.tensor Q equals the sum of those of P and Q.
    - declaration: "NumberField.ArchimedeanNorms.height_rescale"
      file: "DedekindIdealArithmetic/NumberField/MetricRescaling.lean"
      note: >-
        For a number field K, an invertible O_K-module and positive factors
        c : InfinitePlace K → ℝ≥0ˣ, rescale multiplies each ordinary fibre norm
        by c_v. Its height is the original
        height divided by the product of c_v raised to InfinitePlace.mult v.
        The multiplicities are one at real places and two at complex places.
    - declaration: "NumberField.ArchimedeanNorms.normalizedLogHeight_rescale"
      file: "DedekindIdealArithmetic/NumberField/MetricRescaling.lean"
      note: >-
        Under the same rescaling hypotheses, normalized logarithmic height
        is the original value minus the sum of InfinitePlace.mult v times
        log c_v divided by [K:Q]. Height need not be at least one and
        logarithmic height need not be nonnegative.
    - declaration: "NumberField.ArchimedeanNorms.height_comap"
      file: "DedekindIdealArithmetic/NumberField/MetricTransport.lean"
      note: >-
        For a number field K, invertible O_K-modules M and N, a metric Q on N
        and an equivalence e : M ≃ₗ[𝓞 K] N,
        (Q.comap e).height = Q.height. The source metric is the pullback on
        every completion fibre; no arbitrary metric change is permitted.
    - declaration: "NumberField.ArchimedeanNorms.normalizedLogHeight_comap"
      file: "DedekindIdealArithmetic/NumberField/MetricTransport.lean"
      note: >-
        Under the same pullback hypotheses, normalized logarithmic height is
        preserved. Metric pullback itself needs neither module invertible
        and satisfies the identity and contravariant composition laws.
    - declaration: "FractionalIdeal.absNorm_spanSingleton_eq_cardQuot_mul"
      file: "DedekindIdealArithmetic/Ideal/FractionalNorm.lean"
      note: >-
        For a Dedekind domain finite free over the integers and a fraction
        field, the principal fractional ideal generated by any element x of
        a fractional ideal I has norm cardQuot (span {x}) times norm I.
        Zero ideals and elements are included; infinite indices are zero.
        No number-field structure on the fraction field is required.
    - declaration: "FractionalIdeal.absNorm_eq_finprod_count"
      file: "DedekindIdealArithmetic/Ideal/FractionalNorm.lean"
      note: >-
        For a Dedekind domain R finite free over the integers and a fraction
        field F, absNorm I equals the rational finite-support product of
        Ideal.absNorm p.asIdeal raised to FractionalIdeal.count F p I, over
        height-one primes p, provided I is nonzero. No NumberField F,
        Q-algebra structure on F or integral basis is required. At the zero
        ideal all counts vanish, giving product one rather than norm zero.
    - declaration: "NumberField.FinitePlace.absNorm_eq_finprod_count"
      file: "DedekindIdealArithmetic/NumberField/FinitePlaceHeight.lean"
      note: >-
        For a number field K and a nonzero fractional ideal I, the real cast
        of absNorm I is the finite-support product over finite places w of
        q_w raised to FractionalIdeal.count K w.maximalIdeal I, where
        q_w = Ideal.absNorm w.maximalIdeal.asIdeal is the residue cardinality.
        The signed exponents use no extra finite-place weights.
    - declaration: "NumberField.ArchimedeanNorms.height_eq_finitePlace"
      file: "DedekindIdealArithmetic/NumberField/FinitePlaceHeight.lean"
      note: >-
        For a number field K, Module.Invertible (O_K) M, archimedean norms P
        and any rational frame e, P.height equals the finite-support product
        of residue cardinalities raised to the negatives of the counts of
        e.coefficientIdeal, divided by the product of
        P.rationalEval v (e.symm 1) raised to v.mult over infinite places v.
        Nonzeroness of the coefficient ideal follows from the frame. No
        integral section, integral basis, new height or further metric data
        are required. The denominator has weights one at real places and
        two at complex places; multiplicative height has no degree root.
    - declaration: "LinearEquiv.cardQuot_span_singleton_mul_absNorm_coefficientIdeal"
      file: "DedekindIdealArithmetic/Module/CoefficientIdealNorm.lean"
      note: >-
        A supplied rational frame for a finite torsion-free module over a
        Dedekind domain finite free over the integers gives, for every section,
        its span index times the coefficient-ideal norm equal to the principal
        fractional norm of its coefficient. No invertibility or freeness over
        the Dedekind domain is assumed.
    - declaration: "NumberField.ArchimedeanNorms.normProduct_eq_rationalFrame"
      file: "DedekindIdealArithmetic/NumberField/RationalFrameHeight.lean"
      note: >-
        In any supplied rational frame, the weighted norm product of every
        integral section equals the absolute field norm of its coefficient
        times the weighted rational norm product of the frame unit vector.
        This needs no finiteness, torsion-freeness or invertibility of the
        integral module and includes zero sections.
    - declaration: "NumberField.ArchimedeanNorms.height_eq_rationalFrame"
      file: "DedekindIdealArithmetic/NumberField/RationalFrameHeight.lean"
      note: >-
        For a number field and an invertible module over its ring of integers,
        every supplied rational frame evaluates the existing intrinsic height
        as the reciprocal of the product of the coefficient-ideal norm and
        the weighted archimedean norm product of its rational unit vector.
        No integral basis or second height definition is introduced.
    - declaration: "NumberField.ArchimedeanNorms.normalizedLogHeight_eq_rationalFrame"
      file: "DedekindIdealArithmetic/NumberField/RationalFrameHeight.lean"
      note: >-
        Under the same height hypotheses, normalized logarithmic height is
        minus the logarithm of the coefficient-ideal norm and the weighted
        archimedean logarithmic sum, divided by [K:Q]. There is no degree root
        in multiplicative height and no nonnegativity assertion.
    - declaration: "LinearEquiv.coefficientIdeal"
      file: "DedekindIdealArithmetic/Module/CoefficientIdeal.lean"
      note: >-
        For a commutative ring R, a fraction field F, a finitely generated
        R-module M and a supplied frame e : F ⊗[R] M ≃ₗ[F] F,
        the coefficient ideal is the nonzero fractional ideal whose elements
        are exactly e (1 tensor m) for m in M. The scalar module in its
        multiplication frame gives the unit ideal. Neither injectivity of
        M into its rational fibre nor integral freeness is assumed; this
        construction does not define a frame-independent height.
    - declaration: "Seminorm.extendScalarsRankOne"
      file: "DedekindIdealArithmetic/Module/RankOneSeminorm.lean"
      note: >-
        For normed fields k and l with NormedAlgebra k l and an invertible
        k-vector space V, any seminorm p, possibly degenerate, extends uniquely
        to l tensor_k V with value norm(a) * p(x) on a tensor x. Restriction
        along 1 tensor x recovers p, definiteness is preserved when p is
        definite, and the unit line recovers the norm of l. No completeness
        or finite-extension hypothesis is imposed; this is not a height law.
    - declaration: "NumberField.InfinitePlace.Completion.isometry_completionMap"
      file: "DedekindIdealArithmetic/NumberField/Completion/Extension.lean"
      note: >-
        For fields K and L with Algebra K L and infinite places v and w
        satisfying w.LiesOver v, Mathlib's completionMap extends the field
        algebra map and preserves the ordinary norm. The identity field map
        gives the identity on the completion. No number-field, finite-extension
        or real-place hypothesis is needed; no extension-height law is asserted.

automation:
  methods:
    - method: "agent"
      framework: "AI agents using Lean and Lake"
      tool_setup: >-
        AI agents composed Lean proofs using mathlib APIs and ordinary
        tactics such as rw, simp, constructor, congr, by_cases and typeclass
        inference. Toolchain and dependency revisions are pinned by the
        repository's Lean/Lake files.
  notes: >-
    AI agents authored the Lean proofs and documentation. AI involvement does
    not itself establish origin, correctness or rights.

fidelity:
  divergences: >-
    The ideal-norm extraction removes the earlier cyclotomic specialization:
    norm comparison needs only an infinite Dedekind domain with finite
    quotients, while principal-prime extraction uses finite freeness over the
    integers and a prime absolute norm, not a positive signed norm.
    The localization criterion is generic and conditional on the supplied
    generator and killing proofs. These prerequisites are not a formalization
    of a concrete cyclotomic or geometric example. No new K-theory,
    class-group or ideal encoding is introduced. The height construction uses
    Module.Invertible rather than integral freeness and Submodule.cardQuot
    rather than prescribed indices. The metric data are definite seminorms
    on all completion-fibre vectors, not assumed section independence or
    assumed quotient finiteness. Tensor metrics use field-fibre coordinates,
    not global integral bases, and satisfy the pure-tensor norm formula.
    Positive rescaling uses ordinary unsquared norms and divides height by
    the weighted factor; equivalence pullback states the precise isometry
    condition. These laws concern fixed-field intrinsic heights. Coefficient
    ideals depend on supplied rational frames, while their norms combined with
    the weighted rational unit-vector norm product evaluate the same intrinsic
    height in every frame. The generic prime-exponent norm formula works over
    any Dedekind domain finite free over the integers and its fraction field,
    without a number-field or Q-algebra hypothesis on that field; it requires
    a nonzero ideal. Reindexing it by finite places expresses height using
    negative coefficient-ideal exponents and residue cardinalities, without
    adding finite-place norm or valuation data. Only normalized logarithmic
    height is divided by the degree. Seminorm scalar extensions and isometric
    completion maps supply further interfaces, not finite-extension height
    formulas. Finite-completion fibre norm constructions, unit-ball
    identifications, tensor transport of finite local frames and finite-extension
    height transport remain open.

review:
  status: "agent-reviewed"
  notes: >-
    AI agents reviewed the ideal-norm, principal-prime and localization results;
    no human review is claimed.

